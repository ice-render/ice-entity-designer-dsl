<!DOCTYPE html>
<html lang="en">
  <meta charset="utf-8" />
  <title>ice-entity-designer-dsl statechart example</title>
  <style>
    body { margin: 0; font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8fafc; color: #0f172a; }
    main { display: grid; grid-template-columns: 460px 1fr; height: 100vh; }
    textarea { width: 100%; height: calc(100vh - 60px); box-sizing: border-box; border: 0; border-right: 1px solid #e2e8f0; padding: 12px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; resize: none; }
    .preview { padding: 12px; overflow: auto; }
    button { margin: 8px; padding: 7px 14px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; }
    canvas { display: block; border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; }
    .hint { margin: 0 8px; color: #64748b; font-size: 12px; }
  </style>
  <body>
    <main>
      <div>
        <button id="render">渲染</button>
        <button id="download-svg">导出 SVG</button>
        <span class="hint">状态坐标可省略：按转移流向自左而右排布；复合状态自动装下子状态</span>
        <textarea id="dsl">
{
  "schemaVersion": 1,
  "kind": "statechart",
  "nodes": [
    { "id": "start", "kind": "initial" },
    { "id": "pending", "title": "待支付" },
    { "id": "paid", "title": "已支付" },
    { "id": "processing", "kind": "composite", "title": "订单处理" },
    { "id": "stock", "title": "库存校验", "parent": "processing" },
    { "id": "ship", "title": "安排发货", "parent": "processing" },
    { "id": "canceled", "title": "已取消" },
    { "id": "done", "kind": "final" }
  ],
  "edges": [
    { "source": "start", "target": "pending" },
    { "source": "pending", "target": "paid", "event": "支付成功", "guard": "金额 > 0", "action": "生成订单" },
    { "source": "pending", "target": "canceled", "event": "超时未支付" },
    { "source": "paid", "target": "stock", "event": "进入处理" },
    { "source": "stock", "target": "ship", "event": "库存充足" },
    { "source": "ship", "target": "done", "event": "已发货" }
  ],
  "options": { "fitViewport": true, "gapX": 110, "gapY": 80 }
}
        </textarea>
      </div>
      <div class="preview">
        <canvas id="canvas" width="1200" height="820"></canvas>
      </div>
    </main>

    <script src="../node_modules/ice-entity-designer/dist/index.umd.js"></script>
    <script src="../dist/index.umd.js"></script>
    <script>
      const textarea = document.getElementById('dsl');

      document.getElementById('download-svg').addEventListener('click', () => {
        const result = window.__dslResult;
        if (!result) {
          return;
        }
        // designer 直接能导出矢量（与应用层同一套 API，DSL 不另造导出）
        const svg = result.designer.toSvg({ padding: 16, background: '#ffffff' });
        window.__exportedSvg = svg;
        const blob = new Blob([svg], { type: 'image/svg+xml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'order-statechart.svg';
        a.click();
        URL.revokeObjectURL(url);
      });

      document.getElementById('render').addEventListener('click', () => {
        const oldCanvas = document.getElementById('canvas');
        const nextCanvas = oldCanvas.cloneNode(false);
        oldCanvas.parentNode.replaceChild(nextCanvas, oldCanvas);
        try {
          window.__dslResult = ICEDSL.renderDsl('canvas', JSON.parse(textarea.value));
          window.__dslErrors = window.__dslResult.designer.validateStatechart();
        } catch (error) {
          alert(error.message);
        }
      });

      window.__dslResult = ICEDSL.renderDsl('canvas', JSON.parse(textarea.value));
      window.__dslErrors = window.__dslResult.designer.validateStatechart();
    </script>
  </body>
</html>
