<!DOCTYPE html>
<html lang="en">
  <meta charset="utf-8" />
  <title>ice-entity-designer-dsl statechart example</title>
  <style>
    body { margin: 0; font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8fafc; color: #0f172a; }
    main { display: grid; grid-template-columns: 460px 1fr; height: 100vh; }
    textarea { width: 100%; height: calc(100vh - 60px); box-sizing: border-box; border: 0; border-right: 1px solid #e2e8f0; padding: 12px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; resize: none; }
    .preview { overflow: hidden; }
    button { margin: 8px; padding: 7px 14px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; }
    canvas { display: block; border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; }
    .hint { margin: 0 8px; color: #64748b; font-size: 12px; }
  </style>
  <body>
    <main>
      <div>
        <button id="render">渲染</button>
        <button id="export-doc">导出当前文档</button>
        <button id="download-svg">导出 SVG</button>
        <button id="download-text">导出 PlantUML</button>
        <button id="fit">适应视图</button>
        <button id="reset">复位视图</button>
        <span class="hint">状态坐标可省略：按转移流向自左而右排布；复合状态自动装下子状态</span>
        <textarea id="dsl">
{
  "schemaVersion": 1,
  "kind": "statechart",
  "nodes": [
    { "id": "start", "kind": "initial" },
    { "id": "pending", "title": "待支付" },
    { "id": "paid", "title": "已支付" },
    { "id": "processing", "kind": "composite", "title": "订单处理" },
    { "id": "stock", "title": "库存校验", "parent": "processing" },
    { "id": "ship", "title": "安排发货", "parent": "processing" },
    { "id": "canceled", "title": "已取消" },
    { "id": "done", "kind": "final" }
  ],
  "edges": [
    { "source": "start", "target": "pending" },
    { "source": "pending", "target": "paid", "event": "支付成功", "guard": "金额 > 0", "action": "生成订单" },
    { "source": "pending", "target": "canceled", "event": "超时未支付" },
    { "source": "paid", "target": "stock", "event": "进入处理" },
    { "source": "stock", "target": "ship", "event": "库存充足" },
    { "source": "ship", "target": "done", "event": "已发货" }
  ],
  "options": { "fitViewport": true, "gapX": 110, "gapY": 80 }
}
        </textarea>
      </div>
      <div class="preview">
        <canvas id="canvas" width="1200" height="820"></canvas>
      </div>
    </main>

    <script src="../node_modules/ice-render/dist/index.umd.js"></script>
    <script src="../node_modules/ice-entity-designer/dist/index.umd.js"></script>
    <script src="../dist/index.umd.js"></script>
    <script src="./canvas-interactions.js"></script>
    <script>
      /**
       * 状态机 DSL 示例页。
       *
       * 页面写法与家族其它示例一致：**一页 = 一个类**，构造期把 DOM 引用、事件与首次渲染一次做完。
       * 这页的"变化"是**用户驱动**的（改 JSON 后点渲染 / 导出），不是宿主推数据，所以刷新入口就是 `onUpdate()`（按钮点它重渲）。
       */
      class StatechartDslPage {
        constructor() {
          this.textarea = document.getElementById('dsl');
          this.__wireToolbar();
          this.onUpdate();
          window.__dslErrors = window.__dslResult.designer.validateStatechart();
        }

        /** 渲染：换掉旧画布（引擎按 canvas 元素初始化，复用旧元素会叠两套） */
        onUpdate() {
          const oldCanvas = document.getElementById('canvas');
          const nextCanvas = oldCanvas.cloneNode(false);
          oldCanvas.parentNode.replaceChild(nextCanvas, oldCanvas);
          try {
            const result = ICEDSL.renderDsl('canvas', JSON.parse(this.textarea.value));
            window.__dslErrors = result.designer.validateStatechart();
            this.mount(result);
          } catch (error) {
            alert(error.message);
          }
        }

        /** 挂载交互：canvas 铺满可视区 + 滚轮缩放 + 空白/中键拖拽平移 */
        mount(result) {
          window.__dslResult = result;
          const canvas = document.getElementById('canvas');
          window.__view = IedCanvasViewport.install({ ice: result.ice, canvas, designer: result.designer });
          window.__view.fitViewport();
        }

        fit() {
          if (window.__view) window.__view.fitViewport();
        }

        reset() {
          if (window.__view) window.__view.reset();
        }

        exportSvg() {
          const result = window.__dslResult;
          if (!result) {
            return;
          }
          // designer 直接能导出矢量（与应用层同一套 API，DSL 不另造导出）
          const svg = result.designer.toSvg({ padding: 16, background: '#ffffff' });
          window.__exportedSvg = svg;
          const blob = new Blob([svg], { type: 'image/svg+xml' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'order-statechart.svg';
          a.click();
          URL.revokeObjectURL(url);
        }

        exportText() {
          const result = window.__dslResult;
          if (!result) {
            return;
          }
          // 文本互操作：PlantUML 状态图可直接贴进 Wiki / Markdown / 代码评审
          const text = IED.toPlantUmlState(result.designer, { title: 'DSL 生成的状态机' });
          window.__exportedText = text;
          const blob = new Blob([text], { type: 'text/plain' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'order-statechart.puml';
          a.click();
          URL.revokeObjectURL(url);
        }

        /**
         * 「导出当前文档」：把画布上（可能已被用户拖动 / 改名 / 分合过）的实例写回成同一份 DSL。
         * 这就是 toDsl() 的往返：renderDsl() → 用户编辑 → toDsl()，导出的文档可以再渲染回去。
         */
        exportDoc(event) {
          try {
            const doc = window.__dslResult.toDsl();
            document.getElementById('dsl').value = JSON.stringify(doc, null, 2);
            const button = event.currentTarget;
            const label = button.textContent;
            button.textContent = '已导出到左侧';
            setTimeout(() => (button.textContent = label), 1200);
          } catch (error) {
            alert(error.message);
          }
        }

        __wireToolbar() {
          document.getElementById('render').addEventListener('click', () => this.onUpdate());
          document.getElementById('download-svg').addEventListener('click', () => this.exportSvg());
          document.getElementById('download-text').addEventListener('click', () => this.exportText());
          document.getElementById('fit').addEventListener('click', () => this.fit());
          document.getElementById('reset').addEventListener('click', () => this.reset());
          document.getElementById('export-doc').addEventListener('click', (event) => this.exportDoc(event));
        }
      }

      new StatechartDslPage();
    </script>

  </body>
</html>
