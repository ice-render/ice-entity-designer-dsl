<!DOCTYPE html>
<html lang="en">
  <meta charset="utf-8" />
  <title>ice-entity-designer-dsl gantt example</title>
  <style>
    body { margin: 0; font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8fafc; color: #0f172a; }
    main { display: grid; grid-template-columns: 460px 1fr; height: 100vh; }
    textarea { width: 100%; height: calc(100vh - 60px); box-sizing: border-box; border: 0; border-right: 1px solid #e2e8f0; padding: 12px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; resize: none; }
    .preview { overflow: hidden; }
    button { margin: 8px; padding: 7px 14px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; }
    canvas { display: block; border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; }
    .hint { margin: 0 8px; color: #64748b; font-size: 12px; }
  </style>
  <body>
    <main>
      <div>
        <button id="render">渲染</button>
        <button id="export-doc">导出当前文档</button>
        <button id="download-svg">导出 SVG</button>
        <button id="download-text">导出 Mermaid</button>
        <button id="fit">适应视图</button>
        <button id="reset">复位视图</button>
        <span class="hint">甘特文档不写坐标：横轴是日期，纵轴是声明顺序；options.autoSchedule=true 会按依赖把排期推到最早可行</span>
        <textarea id="dsl">
{
  "schemaVersion": 1,
  "kind": "gantt",
  "nodes": [
    { "id": "review", "title": "需求评审", "start": "2026-03-02", "days": 4, "progress": 1 },
    { "id": "design", "title": "交互设计", "start": "2026-03-05", "days": 6, "progress": 0.8 },
    { "id": "frontend", "title": "前端开发", "start": "2026-03-10", "days": 12, "progress": 0.35, "resource": "前端组" },
    { "id": "backend", "title": "后端接口", "start": "2026-03-09", "days": 14, "progress": 0.5, "resource": "后端组" },
    { "id": "test", "title": "联调测试", "start": "2026-03-24", "days": 6 },
    { "id": "release", "title": "灰度发布", "start": "2026-03-30", "days": 4 }
  ],
  "edges": [
    { "source": "review", "target": "design" },
    { "source": "design", "target": "frontend" },
    { "source": "review", "target": "backend" },
    { "source": "frontend", "target": "test" },
    { "source": "backend", "target": "test" },
    { "source": "test", "target": "release" }
  ],
  "options": { "dayWidth": 28, "fitViewport": true, "autoSchedule": true }
}
        </textarea>
      </div>
      <div class="preview">
        <canvas id="canvas" width="1200" height="820"></canvas>
      </div>
    </main>

    <script src="../node_modules/ice-entity-designer/dist/index.umd.js"></script>
    <script src="../dist/index.umd.js"></script>
    <script src="./canvas-interactions.js"></script>
    <script>
      const textarea = document.getElementById('dsl');

      document.getElementById('download-svg').addEventListener('click', () => {
        const result = window.__dslResult;
        if (!result) {
          return;
        }
        const svg = result.designer.toSvg({ padding: 16, background: '#ffffff' });
        window.__exportedSvg = svg;
        const blob = new Blob([svg], { type: 'image/svg+xml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'release-gantt.svg';
        a.click();
        URL.revokeObjectURL(url);
      });

      document.getElementById('download-text').addEventListener('click', () => {
        const result = window.__dslResult;
        if (!result) {
          return;
        }
        // 文本互操作：Mermaid gantt 可直接贴进 Markdown / 文档站 / PR 描述
        const text = IED.toMermaidGantt(result.designer, { title: '移动端 2.0 发布排期' });
        window.__exportedText = text;
        const blob = new Blob([text], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'release-gantt.mmd';
        a.click();
        URL.revokeObjectURL(url);
      });

      document.getElementById('render').addEventListener('click', () => {
        const oldCanvas = document.getElementById('canvas');
        const nextCanvas = oldCanvas.cloneNode(false);
        oldCanvas.parentNode.replaceChild(nextCanvas, oldCanvas);
        try {
          const result = ICEDSL.renderDsl('canvas', JSON.parse(textarea.value));
          window.__dslErrors = result.designer.validateGantt();
          mount(result);
        } catch (error) {
          alert(error.message);
        }
      });

      /** 挂载交互：canvas 铺满可视区 + 滚轮缩放 + 空白/中键拖拽平移 */
      function mount(result) {
        window.__dslResult = result;
        const canvas = document.getElementById('canvas');
        window.__view = IedCanvasViewport.install({ ice: result.ice, canvas, designer: result.designer });
        window.__view.fitViewport();
      }

      document.getElementById('fit').addEventListener('click', () => window.__view && window.__view.fitViewport());
      document.getElementById('reset').addEventListener('click', () => window.__view && window.__view.reset());

      mount(ICEDSL.renderDsl('canvas', JSON.parse(textarea.value)));
      window.__dslErrors = window.__dslResult.designer.validateGantt();
    </script>
    <script>
      /**
       * 「导出当前文档」：把画布上（可能已被用户拖动 / 改名 / 分合过）的实例写回成同一份 DSL。
       * 这就是 toDsl() 的往返：renderDsl() → 用户编辑 → toDsl()，导出的文档可以再渲染回去。
       */
      document.getElementById('export-doc').addEventListener('click', (event) => {
        try {
          const doc = window.__dslResult.toDsl();
          document.getElementById('dsl').value = JSON.stringify(doc, null, 2);
          const button = event.currentTarget;
          const label = button.textContent;
          button.textContent = '已导出到左侧';
          setTimeout(() => (button.textContent = label), 1200);
        } catch (error) {
          alert(error.message);
        }
      });
    </script>

  </body>
</html>
