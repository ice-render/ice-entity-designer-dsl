    canvas { display: block; border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; }

    <script src="../node_modules/ice-render/dist/index.umd.js"></script>
    <script src="../node_modules/ice-entity-designer/dist/index.umd.js"></script>
    <script src="../dist/index.umd.js"></script>
    <script src="./canvas-interactions.js"></script>
    <script>
      /**
       * 电力一次接线 DSL 示例页。
       *
       * 页面写法与家族其它示例一致：**一页 = 一个类**，构造期把 DOM 引用、事件与首次渲染一次做完。
       * 这页的"变化"是**用户驱动**的（改 JSON 后点渲染 / 导出），不是宿主推数据，所以没有 `onUpdate()`。
       */
      class PowerDslPage {
        constructor() {
          this.textarea = document.getElementById('dsl');
          this.__wireToolbar();
          this.render();
          window.__dslErrors = window.__dslResult.designer.validatePower();
        }

        /** 渲染：换掉旧画布（引擎按 canvas 元素初始化，复用旧元素会叠两套） */
        render() {
          const oldCanvas = document.getElementById('canvas');
          const nextCanvas = oldCanvas.cloneNode(false);
          oldCanvas.parentNode.replaceChild(nextCanvas, oldCanvas);
          try {
            const result = ICEDSL.renderDsl('canvas', JSON.parse(this.textarea.value));
            window.__dslErrors = result.designer.validatePower();
            this.mount(result);
          } catch (error) {
            alert(error.message);
          }
        }

        /** 挂载交互：canvas 铺满可视区 + 滚轮缩放 + 空白/中键拖拽平移 */
        mount(result) {
          window.__dslResult = result;
          window.__view = IedCanvasViewport.install({ ice: result.ice, canvas: document.getElementById('canvas'), designer: result.designer });
          window.__view.fitViewport();
        }

        fit() {
          if (window.__view) window.__view.fitViewport();
        }

        reset() {
          if (window.__view) window.__view.reset();
        }

        exportSvg() {
          const result = window.__dslResult;
          if (!result) return;
          const svg = result.designer.toSvg({ padding: 16, background: '#ffffff' });
          window.__exportedSvg = svg;
          const blob = new Blob([svg], { type: 'image/svg+xml' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'substation-single-line.svg';
          a.click();
          URL.revokeObjectURL(url);
        }

        /**
         * 「导出当前文档」：把画布上（可能已被用户拖动 / 改名 / 分合过）的实例写回成同一份 DSL。
         * 这就是 toDsl() 的往返：renderDsl() → 用户编辑 → toDsl()，导出的文档可以再渲染回去。
         */
        exportDoc(event) {
          try {
            const doc = window.__dslResult.toDsl();
            document.getElementById('dsl').value = JSON.stringify(doc, null, 2);
            const button = event.currentTarget;
            const label = button.textContent;
            button.textContent = '已导出到左侧';
            setTimeout(() => (button.textContent = label), 1200);
          } catch (error) {
            alert(error.message);
          }
        }

        __wireToolbar() {
          document.getElementById('render').addEventListener('click', () => this.render());
          document.getElementById('fit').addEventListener('click', () => this.fit());
          document.getElementById('reset').addEventListener('click', () => this.reset());
          document.getElementById('download-svg').addEventListener('click', () => this.exportSvg());
          document.getElementById('export-doc').addEventListener('click', (event) => this.exportDoc(event));
        }
      }

      new PowerDslPage();
    </script>
